# cargo-about: the licenses of every crate linked into phrost, written into each release archive as
# THIRD-PARTY-LICENSES.md (`just licenses`, `.github/workflows/release.yml`). The licenses accepted
# are deny.toml's, with its one exception: MPL-2.0 for option-ext, which asks that a binary say where
# the source is -- each crate is listed with its repository.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
# The platforms a release is built for: a crate only another platform links is not in the binary.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# What builds phrost or tests it is not in what is shipped.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# phrost's own crates are `publish = false`: they are this project, not a third party.
private = { ignore = true }

# Crates published without their license files, whose texts cargo-about would otherwise fill in from
# the license's template (`Copyright (c) <year> <copyright holders>`).
#
# mago ships its licenses at the root of its repository, not in each crate: these are the files at
# the commit 1.58.2 was published from (`.cargo_vcs_info.json`), fetched when the list is generated
# and checked against their SHA-256. A mago bump whose files changed fails the generation until the
# new checksums are written here; every mago crate of one release shares one commit.

[mago-allocator.clarify]
license = "MIT OR Apache-2.0"
[[mago-allocator.clarify.git]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "0562f9f7aa4ee4f7d5e35460d447bd8c4594b7d73c535bffb3ab88c027af771d"
[[mago-allocator.clarify.git]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a"

