[package]
name = "phrost-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The phrost binary: the language server, and the tools for inspecting it."

[[bin]]
name = "phrost"
path = "src/main.rs"

[dependencies]
toml.workspace = true
clap.workspace = true
lspkit-perf.workspace = true
lspkit-ratchet.workspace = true
lspkit-heap.workspace = true
phrost-analysis.workspace = true
phrost-framework.workspace = true
phrost-index.workspace = true
phrost-lsp.workspace = true
phrost-model.workspace = true
phrost-project.workspace = true
phrost-stubs.workspace = true
phrost-syntax-features.workspace = true
phrost-vfs.workspace = true
phrost-view.workspace = true
tokio.workspace = true

# `override` puts mimalloc v2 under `Heap` and under every C library in the binary (tree-sitter), so
# `release_freed` gives back what they freed too. macOS only: there nothing else asks the system
# allocator for them, and on the 29 094-file reference checkout the footprint after bootstrap went
# from 170 MB to 151-156 (docs/08-performance.md). On Linux glibc gives them back by itself, and orthra
# measured mimalloc's own reserve at 4.5 MB more RSS per project, so Linux stays on glibc.
[target.'cfg(target_os = "macos")'.dependencies]
lspkit-heap = { workspace = true, features = ["override"] }

[dev-dependencies]
expect-test.workspace = true
phrost-testkit.workspace = true

[lints]
workspace = true
